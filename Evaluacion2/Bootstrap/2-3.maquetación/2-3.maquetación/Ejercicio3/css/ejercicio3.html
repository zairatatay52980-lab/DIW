<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Ejercicio 3 - Offset y ordenación</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container-fluid">

        <header class="row">
            <div class="col-12 green">Header</div>
        </header>

        <div class="row">
            <div class="col-6 col-sm-3 offset-lg-3 blue">1</div>
            <div class="col-6 col-sm-3 blue">2</div>
            
            <div class="w-100 d-none d-lg-block"></div>
            
            <div class="col-6 col-sm-3 blue">3</div>
            <div class="col-6 col-sm-3 offset-lg-6 blue">4</div>
        </div>

        <div class="row d-none d-sm-block d-lg-none">
            <div class="col-12 cyan">Tablet</div>
        </div>

        <div class="row">
            <div class="col-6 col-sm-3 order-lg-4 grey">a</div>
            <div class="col-6 col-sm-3 order-lg-3 grey">b</div>
            <div class="col-6 col-sm-3 order-lg-2 grey">c</div>
            <div class="col-6 col-sm-3 order-lg-1 grey">d</div>
        </div>

        <div class="row d-sm-none">
            <div class="col-12 cyan">Mobile</div>
        </div>

        <div class="row d-none d-lg-block">
            <div class="col-12 cyan">Desktop</div>
        </div>

        <div class="row">
            <div class="d-none d-sm-block col-sm-6 col-lg-3 offset-lg-3 salmon">:(</div>
            <div class="col-12 col-sm-6 col-lg-3 salmon">:D</div>
        </div>

        <footer class="row">
            <div class="col-12 green">Footer</div>
        </footer>

    </div>
</body>
</html>
